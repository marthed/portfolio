<html>
  <head>
    <title>Martin Hedlund</title>
    <link rel="stylesheet" href="style.css">
    <script>
      function loadPage(page) {
        fetch(page).then(res =>  res.text()).then(html => {
          document.getElementById("content").innerHTML = html;
        }).catch(error => {
          console.log(error);
        })
      }
    </script>
    <script>
      window.addEventListener("load", () => {
        loadPage("static/pages/about.html")
      });
    </script>
  </head>
  <body>
    <div class="main-container">
      <div class="main-container-inner">

        <div class="header-container">
          <div class="image-container">
            <img class="rounded" alt="profile"
              src="static/images/profile_3.jpg" />
          </div>
          <header>Martin Hedlund</header>
        </div>

        <nav>
          <div class="menu">
            <a href="#" onclick="loadPage('static/pages/about.html')"><div
                class="menu-option">About</div></a>
            <a href="#" onclick="loadPage('static/pages/projects.html')"><div
                class="menu-option">Projects</div></a>
          </div>
        </nav>
        <div class="contact-info">
          <div class="icons">
            <a class="clickable"
              href="https://www.linkedin.com/in/martin-hedlund-94186011/"
              target="_blank"><img class="clickable"
                src="https://ssl.gstatic.com/atari/images/sociallinks/linkedin_colored_28dp.png"
                alt="LinkedIn" style="width: 40px; height: 40px;"></a>
            <a class="clickable" href="https://github.com/marthed"
              target="_blank"><img class="clickable"
                src="https://ssl.gstatic.com/atari/images/sociallinks/github_colored_28dp.png"
                alt="GitHub" style="width: 40px; height: 40px;"></a>
            <a class="clickable" href="https://orcid.org/0009-0002-0080-3113"
              target="_blank"><img class="clickable"
                src="static/images/orcid.jpg" alt="orcid"

          </div>

          <span class="delimeter"></span>
          <span class="contact-info-text">+46739074333</span>
          <span class="contact-info-text">marthed@kth.se</span>
          <span class="contact-info-text">martinhedlund@live.com</span>
